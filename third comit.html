<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МебельМаркет</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

header{
background:#2c2c2c;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header-left{
text-align:left;
}

.header-right{
display:flex;
gap:10px;
}

.search{
padding:8px;
border-radius:5px;
border:none;
}

.cart-count{
background:red;
color:white;
padding:2px 6px;
border-radius:50%;
font-size:12px;
}

nav{
background:#444;
padding:10px;
text-align:center;
}

nav a{
color:white;
margin:0 15px;
text-decoration:none;
font-weight:bold;
}

nav a:hover{
color:#ffd700;
}

.container{
width:90%;
margin:auto;
padding:20px;
}

.section{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:8px;
}

.products{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.product{
background:#eee;
padding:15px;
width:250px;
border-radius:6px;
text-align:center;
}

.product img{
width:100%;
height:150px;
object-fit:cover;
border-radius:5px;
}

button{
margin-top:10px;
padding:10px;
background:#333;
color:white;
border:none;
cursor:pointer;
}

footer{
background:#222;
color:white;
text-align:center;
padding:15px;
}

/* modal */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
padding:30px;
border-radius:10px;
width:350px;
position:relative;
}

.close{
position:absolute;
right:15px;
top:10px;
cursor:pointer;
font-size:20px;
}

.modal input{
width:100%;
padding:10px;
margin-bottom:10px;
}

.login-btn{
width:100%;
background:#3a6fb0;
}

</style>
</head>

<body>

<header>

<div class="header-left">
<h1>МебельМаркет</h1>
</div>

<input class="search" id="search" placeholder="Поиск мебели...">

<div class="header-right">
<button onclick="openModal()">Аккаунт</button>
<button>Корзина <span id="cartCount" class="cart-count">0</span></button>
</div>

</header>

<nav>
<a href="#home">Главная</a>
<a href="#catalog">Каталог</a>
<a href="#about">О магазине</a>
<a href="#contacts">Контакты</a>
</nav>

<div class="container">

<section id="catalog" class="section">
<h2>Каталог мебели</h2>

<div class="products" id="products">

<div class="product">
<img src="https://picsum.photos/300/200?1">
<h3 data-title>Диван</h3>
<p data-price>850 BYN</p>
<button onclick="addToCart()">В корзину</button>
</div>

<div class="product">
<img src="https://picsum.photos/300/200?2">
<h3 data-title>Стол</h3>
<p data-price>320 BYN</p>
<button onclick="addToCart()">В корзину</button>
</div>

<div class="product">
<img src="https://picsum.photos/300/200?3">
<h3 data-title>Шкаф</h3>
<p data-price>640 BYN</p>
<button onclick="addToCart()">В корзину</button>
</div>

</div>

</section>

<section id="about" class="section">
<h2>О магазине</h2>
<p>Мы продаём современную мебель для дома и офиса.</p>
</section>

<section id="contacts" class="section">
<h2>Контакты</h2>
<p>Телефон: +375 29 000 00 00</p>
<p>Email: info@mebel.by</p>
</section>

</div>

<footer>
<p>© 2026 МебельМаркет</p>
</footer>

<!-- AUTH MODAL -->

<div class="modal" id="authModal">

<div class="modal-content">

<span class="close" onclick="closeModal()">✖</span>

<h2>Вход</h2>

<form data-registration>

<input type="email" placeholder="Электронная почта">

<input type="password" placeholder="Пароль">

<button class="login-btn">Продолжить</button>

</form>

<p style="text-align:center;color:#3a6fb0;cursor:pointer;">Регистрация</p>

</div>

</div>

<script>

let cart=0

function addToCart(){
cart++
document.getElementById("cartCount").innerText=cart
}

function openModal(){
document.getElementById("authModal").style.display="flex"
}

function closeModal(){
document.getElementById("authModal").style.display="none"
}

document.getElementById("search").addEventListener("input",function(){

let value=this.value.toLowerCase()
let products=document.querySelectorAll(".product")

products.forEach(p=>{
let title=p.querySelector("h3").innerText.toLowerCase()

p.style.display=title.includes(value)?"block":"none"
})

})

</script>

</body>
</html>
